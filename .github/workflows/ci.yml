name: foundation-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: itsmytoy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d itsmytoy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/itsmytoy_test
      RUNTIME_DATABASE_ROLE: itsmytoy_runtime
      RUNTIME_DATABASE_PASSWORD: runtime-password-for-ci-only
      MIGRATION_DATABASE_ROLE: itsmytoy_migrator
      MIGRATION_DATABASE_PASSWORD: migrator-password-for-ci-only
      MIGRATION_DATABASE_URL: postgresql://itsmytoy_migrator:migrator-password-for-ci-only@localhost:5432/itsmytoy_test
      DATABASE_URL: postgresql://itsmytoy_runtime:runtime-password-for-ci-only@localhost:5432/itsmytoy_test
      TEST_DATABASE_URL: postgresql://itsmytoy_runtime:runtime-password-for-ci-only@localhost:5432/itsmytoy_test
      TEST_MIGRATION_DATABASE_URL: postgresql://itsmytoy_migrator:migrator-password-for-ci-only@localhost:5432/itsmytoy_test
      WORKOS_API_KEY: sk_test_ci_placeholder
      WORKOS_CLIENT_ID: client_ci_placeholder
      WORKOS_COOKIE_PASSWORD: ci-placeholder-cookie-password-32-chars
      WORKOS_REDIRECT_URI: http://127.0.0.1:3000/auth/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:roles
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run security:audit
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
